<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace">
  <rect x="0" y="0" width="900" height="640" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="0" width="900" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="900" height="10" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="21" fill="#8b949e" font-size="12" text-anchor="middle">/proc/laiba/brain &#8212; lsmod</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- layered modules, each a loaded kernel module with a description column -->
  <g font-size="14">
    <rect x="60" y="56" width="280" height="50" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="80" y="87" fill="#c9d1d9">curiosity.ko</text>
    <text x="360" y="87" fill="#8b949e" font-size="12.5">loaded first, unloads last</text>
    <line x1="200" y1="106" x2="200" y2="128" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="128" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="159" fill="#c9d1d9">question_generator.ko</text>
    <text x="360" y="159" fill="#8b949e" font-size="12.5">interrupts on "that seems off"</text>
    <line x1="200" y1="178" x2="200" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="200" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="231" fill="#c9d1d9">system_understanding.ko</text>
    <text x="360" y="231" fill="#8b949e" font-size="12.5">reads the whole codebase first</text>
    <line x1="200" y1="250" x2="200" y2="272" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="272" width="280" height="50" rx="6" fill="#161b22" stroke="#f0883e"/>
    <text x="80" y="303" fill="#c9d1d9">documentation.ko</text>
    <text x="360" y="303" fill="#8b949e" font-size="12.5">writes itself, mostly unprompted</text>
    <line x1="200" y1="322" x2="200" y2="344" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="344" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="375" fill="#c9d1d9">architecture_gen.ko</text>
    <text x="360" y="375" fill="#8b949e" font-size="12.5">diagrams before code, always</text>
    <line x1="200" y1="394" x2="200" y2="416" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="416" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="447" fill="#c9d1d9">backend.ko</text>
    <text x="360" y="447" fill="#8b949e" font-size="12.5">fastapi, postgres, redis, docker</text>
    <line x1="200" y1="466" x2="200" y2="488" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="488" width="280" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="519" fill="#c9d1d9">ai_layer.ko</text>
    <text x="360" y="519" fill="#8b949e" font-size="12.5">bedrock, langgraph, rag, pgvector</text>
    <line x1="200" y1="538" x2="200" y2="560" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="60" y="560" width="280" height="50" rx="6" fill="#161b22" stroke="#3fb950"/>
    <text x="80" y="591" fill="#c9d1d9">production.ko</text>
    <text x="360" y="591" fill="#8b949e" font-size="12.5">the only acceptable exit state</text>
  </g>

  <text x="700" y="610" fill="#6e7681" font-size="11.5" text-anchor="middle">8 modules resident, 0 unused</text>
</svg>
